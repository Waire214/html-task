<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
</head>
<body>
    <h1>Employee Registration Webpage</h1>
    <h2>Employee Registration Form</h2>
    <p>Below is a form for employee registration</p>
     <form action="/somewhere" method="post">
        <fieldset>
            <legend>Employee Registration</legend>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
            <label for="address">Address:</label><br>
            <input type="text" id="address" name="address"><br><br>
            <label for="linkedin"></label>
            <input type="url" id="linkedin" name="linkedin" placeholder="LinkedIn Profile URL"><br><br>
            <label for="github"></label>
            <input type="url" id="github" name="github" placeholder="GitHub Profile URL"><br><br>
            <label for="resume">Resume</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx"><br><br>
            <label for="skills">Skills:</label><br>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label><br>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label><br>
            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label><br>
            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label><br>
            <br><br>
            <input type="submit" value="Submit">
        </fieldset>
     </form>
     <hr>
        <a href="index.html">Back to index page</a>
</body>
</html>
